# Plus 60 – läuft jeden Tag automatisch:
# 1. holt die Ist-Daten des Vortags (opentransportdata.swiss)
# 2. sucht alle Fahrten mit ≥ 60 Min. Verspätung und speichert die Analyse in docs/data/
# 3. veröffentlicht das Dashboard auf GitHub Pages
name: Tägliche Analyse

on:
  schedule:
    - cron: "23 5 * * *"    # ca. 06:23 Uhr Schweizer Zeit (Winter), 07:23 (Sommer)
    - cron: "23 9 * * *"    # Reserve, falls die Datei später erscheint
    - cron: "23 15 * * *"   # zweite Reserve
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage rückwirkend nachholen? (leer = automatisch)"
        required: false
        default: ""
      neu:
        description: "Schon berechnete Tage neu rechnen (nach Änderungen an der Methode)"
        type: boolean
        default: false

concurrency:
  group: plus60
  cancel-in-progress: false

jobs:
  analyse:
    name: Verspätungen analysieren
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Code holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r pipeline/requirements.txt

      - name: Ist-Daten holen und auswerten
        run: python pipeline/analyse.py ${{ inputs.tage && format('--tage {0}', inputs.tage) || '' }} ${{ inputs.neu && '--neu' || '' }}

      - name: Ergebnisse speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "plus60-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Analyse vom $(TZ=Europe/Zurich date +%d.%m.%Y)"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi

  dashboard:
    name: Dashboard veröffentlichen
    needs: analyse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Neusten Stand holen
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Dashboard hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v5
